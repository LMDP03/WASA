openapi: 3.0.3
info:
  title: Simplified login API specification
  description: |-
    This OpenAPI document describes the simplified login API.
    Copy and paste the API from the `paths` key to your OpenAPI document.
  version: "1"

components:

  schemas:
  
    User:
      title: User
      type: object
      properties:
        id:
          description: |-
            the unique authorization id of a user;
            it's automatically generated when a new user account is made
            and can't be changed in any way.
          type: string
          format: password
          readOnly: true
          example: "adksb32r5E$&"
        name:
          description: |-
            the username you choose;
            it can be later modified, but no 2 people can have the same one at the same time
          type: string
          example: "Maria"
          pattern: 'ˆ.*?$'
          minLength: 3
          maxLength: 16
        picture:
          description: |-
            your profile picture;
            only its user can modify it;
            in private cinversations,
            your profile picture will be the image appearing for that conversation
          type: string
          format: binary
          minLength: 0


    Message:
      title: Message
      type: object
      properties:
        id:
          description: |-
            the unique identifier of this message,
            which is also used by another message to respond/react to this;
            it's automatically generated when the message is first created and sent
            and can't be changed unless the message is deleted
          type: integer
          minimum: 1
          example: 1
          readOnly: true
        sender:
          description: |-
            the username with which the sender is saved (if saved at all) in the reveiver's phone book
          $ref: "#/components/schemas/User/properties/name"
          readOnly: true
        timestamp:
          description: The time at which the message was sent
          type: string
          format: date-time
          example: "2017-07-21T17:32:28Z"
          readOnly: true
        checkmark:
          description: |-
            tells you whether the message was received, read, or none of the two.
            no checkmark indicates that the messages hasn't benn read by (all) the participants of the conversation.
            1 checkmark indicates that the message has been received by all the recipients of that conversation.
            2 checkmarks mean that the message has been read by all the recipients of the conversation.
          type: integer
          example: true
          minimum: 0
          maximum: 2
        content:
          description: |-
            The content of the messsage;
            can be either a simple text message or a file/img/emoji
          type: string
          anyOf:
            - format: byte
              description: text message
              example: "Hello There!"
            - format: binary
              description: image or file (or Gif...)
            - pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]$"
              description: emoji
          minLength: 1
        response:
          description: |-
            contains the snippet of the message to which
            you are responding to, if any.
            if the message isn't an answer to a message, you just
            leave this property empty, and the default null value
            0 will be inserted instead
          $ref: "#/components/schemas/Conversation/properties/preview/properties/snippet"
        forwarded: 
          description: |-
            a boolean flag indicating whether a message is a forwarded copy
            (of an original one), or not;
            if it is (true), the forwarded message won't be modifiable by the user
          type: boolean
          default: false
        reactions:
          description: |-
            the list of all emojis put as reactions to a message.
            each person can put at most one emoji.
          type: array
          minItems: 0
          items:
            type: object
            properties: 
              emoji:
                type: string
                pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]{1}$"
                description: the reaction given to the message
              sender:
                description: the ID of the user who put that reaction to that message
                $ref: "#/components/schemas/User/properties/id"



    Conversation:
      title: Conversation
      type: object
      properties:
        id:
          description: |-
            unique identifier of this chat, automatically generated when the conversation is started
            can't be changed, nor can be reused until the conversation exists
          type: integer
          minimum: 1
          example: 1
          readOnly: true
        name:
          description: |-
            the name given to the chat:
            if it's a group chat, it's the name you chose when you
            made the group and can be changed by an admin;
            otherwise, it's the username of the other person
          oneOf:
            - type: string
              format: byte
              minLength: 0
              maxLength: 16
              description: the group chat's name
              example: "Party Group!"
            - $ref: "#/components/schemas/User/properties/name"
              description: the other user's name
              readOnly: true
        image:
          description: |-
            the image of the chat:
            if it's a group chat, it can be modified by admins.
            if you are in a direct/private conversation (i.e. not in a group),
            and the image is the profile picture of the other user.
          oneOf:
            - type: string
              description: group image, can be modified (by admins)
              format: binary
              minLength: 0
            - $ref: "#/components/schemas/User/properties/picture"
              description: other user's profile pictures
              readOnly: true
        group:
          description: |-
            tells you whether the conversation is a group (true) or not (false).
            false by default, unless the total number of participants is >2
          readOnly: true
          type: boolean
          example: true
        participants:
          description: |-
            the list of participants in the Conversation/chat, stored in alphabetical order,
            along with a boolean value indicating whether they are admins of that group (or not).
            at the very least, there must be one participant in the chat, otherwise the conversation is automatically deleted.
            if there are exactly 2 participants in the conversation, their 'admin' values are set to false automatically.
            when someone creates a new group, or join an already existing one, a new entry will be added to the list, with its username,
            while the 'admin' flag will be automatically set to true if he's the creator, or to false otherwise.
            If all admins leave the conversation, the first person in chronological order among the remaining ones will be set to 'admin' automatically
          type: array
          minItems: 1
          items:
            type: object
            properties:
              participants:
                description: the username of the participant.
                $ref: "#/components/schemas/User/properties/name"
              admin:
                description: |-
                  the admin flag, indicating whether you're an admin or not.
                  the only way to become an admin, is to be either the founder of the group,
                  or to be made one by another admin.
                type: boolean
                default: false
                example: false
        messages:
          description: |-
            the list of messages sent by all users in the chat,
            shown in reverse chronological order.
          type: array
          items:
            $ref: "#/components/schemas/Message"
        preview:
          description: |-
            the preview of the conversation, when you want to load them without accessing them.
            the preview contains the name and picture of the conversation,
            along with the snippet and timestamp of the last sent message.
          type: object
          properties:
            name:
              description: the name of the conversation
              $ref: "#/components/schemas/Conversation/properties/name"
              readOnly: true
            picture:
              description: the photo of the conversation
              $ref: "#/components/schemas/Conversation/properties/image"
              readOnly: true
            snippet:
              description: |-
                the preview of the lastly sent message in that conversation
                if there is no message in the conversation, whether because
                non was sent or because they were all eliminated, the snippet
                will be blank (null) instead.
              type: object
              nullable: true
              default: null
              properties:
                sender:
                  description: sender of the last message
                  $ref: "#/components/schemas/Message/properties/sender"
                timestamp:
                  description: the time at which the last message was sent/received
                  $ref: "#/components/schemas/Message/properties/timestamp"
                content:
                  description: |-
                    the preview of the actual Message:
                    in case of a text it will be the first 30 characters,
                    while if it is an image, you will see a symbol in its stead.
                  oneOf:
                    - $ref: "#/components/schemas/Message/properties/content"
                      maxLength: 30
                      description: text preview
                    - type: string
                      format: binary
                      description: the icon representing an image
                  readOnly: true
                link:
                  description: |-
                    the unique id of the conversation, which is used as a connection to the actual conversation


  parameters:

    Authorization:
      description: the user identifier, which must be passed for any possible operation
      name: id
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/User/properties/id"
    
    ConversationId:
      description: the identifer of a conversation, used for any kind of acess to that conversation
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Conversation/properties/id"

    MessageId:
      description: |-
        unique identifer of a message,
        used whenever you want to comment, respond, share, or modify that message
      name: id
      in: path
      required: true
      schema: 
        $ref: "#/components/schemas/Message/properties/id"
          
        
          


paths:

  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    $ref: "#/components/schemas/User/properties/id"


  /session/user/{name}:
    parameters:
      - $ref: "#/components/parameters/Authorization"
    put:
      tags: ["user"]
      summary: modifies the username, if possible
      description: |-
        if the username isn't already taken,
        modifies the username, with the one specified in the request body.
        thjen, it return the updated profile of the user
      operationId: setMyUserName
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User/properties/name"          
      responses:
        "200":
          description: the name was free and it was successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: the given Authentication id was wrong.
        "400":
          description: the name chosen isn't available. Please choose another one
        "500":
          description: server error occurred. Please, try again in a few minutes.

  /session/user/{picture}:
    parameters:
      - $ref: "#/components/parameters/Authorization"  
    put:
      tags: ["user"]
      summary: modifies the profile picture
      description: |-
        modifies the profile picture, with the one specified in the request body.
        then, it returns the updated profile of the user
      operationId: setMyPhoto
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User/properties/picture"          
      responses:
        "200":
          description: the profile picture was successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: the given Authentication id was wrong.
        "400":
          description: |-
            the chosen picture was corrupted or wrongly loaded.
            Please choose another one or try again.
        "500":
          description: server error occurred. Please, try again in a few minutes.


  /session/conversations:
    parameters:
      - $ref: "#/components/parameters/Authorization"
    get:
      tags: [conversation]
      summary: get list of conversations
      description: |-
        returns the list of all conversations in which the user is a participant.
        the list is given in reverse chronological order (the conversations you had last come first).
        each element of the list is also represented through its preview property
      operationId: getMyConversations
      parameters:
        - name: conversationName
          description: |-
            the conversationName is an optional searchkey:
            when given, the method will return a list with the same spefics as before,
            but only with conversations which names contain the conversationName.
            if you're not interested in searching for anything,
            it will simply return the full list of conversations in which the user is a participant
            and in which there is at least one message sent (whichever user sent it)
          in: query
          required: false
          schema:
            type: string
            format: byte
            minLength: 0
            maxLength: 16
            default: ""
      responses:
        "200":
          description: the profile picture was successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation/properties/preview"
        "401":
          description: the given Authentication id was wrong.
        "500":
          description: server error occurred. Please, try again in a few minutes.
    post: 
      tags: ["group"]
      summary: creates a new group
      description: |-
        creates a new group,
        based on the data defined in the parameters.
        if the operation is successful, return the created group.
        when creating a group, the user can eventually specify
        the group's name, image, and any initial number of participants.
        if None are given, the group will be nameless, the image absent.
        instead, you must select at least one other participant when creating the group.
        initially, you'll be the only admin present in the group and any other member won't be.
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/Conversation"
      responses:
        "201":
          description: group chat successfully created and members successfully added
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Conversation"
        "400":
          description: |-
            not enough participants selected.
            please choose at least one other participant when making a group.
        "401":
          description: the given Authentication id was wrong.
        "500":
          description: server error occurred. Please, try again in a few minutes.
    delete:
      tags: ["conversation"]
      summary: deletes a conversation
      description: |-
        totally deletes a conversation, along with all its messages,
        media and everything else.
        the conversation is then removed from the list of the user's conversation.
        if the deleted conversation was a private chat, the chat can always be searched again,
        but it will appear empty.
        you can delete any number of conversations at once
      requestBody:
        content:
          application/json:
            schema: 
              type: array
              items:
                $ref: "#/components/schemas/Conversation/properties/id"
      responses:
        "200": 
          description: conversations successfully deleted and list successfully updated
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: "#/components/schemas/Conversation/properties/preview"
        "401":
          description: the given Authentication id was wrong.
        "404":
          description: one or more conversations couldn't be found or don't exist
        "500":
          description: server error occurred. Please, try again in a few minutes.


  /session/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: ["conversation"]
      summary: opens the chosen conversation
      description: |-
        based on the given id, taken from the conversation's preview,
        it returns the corresponding conversation
      operationId: getConversation
      responses:
        "200":
          description: conversation successfully loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: there is no conversation with the given id.
        "401":
          description: the given authorization id isn't valid.
        "500":
          description: server error occurred. Please, try again in a few minutes.
    put: 
      tags: ["group"]
      summary: add new members to group
      description: |-
        if the conversation is a group chat, and the user is an admin of such group,
        add one or more new participants to the group chat, then returns the conversation,
        with the newly updated list of participants.
        The new participants are specified in the request body
      operationId: addToGroup
      requestBody:
        content:
          application/json:
            schema: 
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/User/properties/name"
      responses:
              "200":
                description: new members suuessfully added to the group.
                content:
                  application/json:
                    schema: 
                      $ref: "#/components/schemas/Conversation"
              "404":
                description: |-
                  either there is at least one username that is not associated to any real user,
                  or there is no conversation with such id.
              "401":
                description: |-
                  either the given authorization id isn't valid,
                  this conversation is not a group chat,
                  or you aren't an admin for this group.
              "500":
                description: server error occurred. Please, try again in a few minutes.
    delete:
      tags: ["group"]
      summary: leaves the group
      description: |-
        makes you leave a group,
        completely removing you from the group participants' list.
        the messages written and received so far will stay, but
        you won't be able to neither write nor read any new message
        in/from that group/conversation.
        if you were the only remaining admin if the group chat,
        the next person in alphabetical order, will automatically become the new admin.
      operationId: leaveGroup
      responses:
        "204":
          description: you have successfully left the chat.
        "401":
          description: the given authorization id isn't valid.
        "500":
          description: server error occurred. Please, try again in a few minutes.
  

  /session/conversations/{id}/{name}:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/ConversationId"
    put:
      tags: ["group"]
      summary: changes the group's name
      description: |-
        if the conversation is a group chat, and the user is an admin of such group,
        modifies its name with the one given in the request body,
        then returns the modified status of the conversation;
        otherwise, the name remains unchanged
      operationId: setGroupName
      requestBody:
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/Conversation/properties/name"
      responses:
        "200":
          description: conversation name changed successfully.
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Conversation"
        "404":
          description: |-
            either there is at least one username that is not associated to any real user,
            or there is no conversation with such id.
        "401":
          description: |-
            either the given authorization id isn't valid,
            this conversation is not a group chat,
            or you aren't an admin for this group.
        "500":
          description: server error occurred. Please, try again in a few minutes.

  /session/conversations/{id}/{image}:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/ConversationId"
    put:
      tags: ["group"]
      summary: changes the group's image
      description: |-
        if the conversation is a group chat, and the user is an admin of such group,
        modifies its name with the one given in the request body,
        then returns the modified status of the conversation;
        otherwise, the picture remains unchanged
      operationId: setGroupPhoto
      requestBody:
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/Conversation/properties/image"
      responses:
        "200":
          description: conversation picture changed successfully.
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Conversation"
        "404":
          description: |-
            either there is at least one username that is not associated to any real user,
            or there is no conversation with such id.
        "401":
          description: |-
            either the given authorization id isn't valid,
            this conversation is not a group chat,
            or you aren't an admin for this group.
        "500":
          description: server error occurred. Please, try again in a few minutes.


  /session/conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/ConversationId"
    post: 
      tags: ["message"]
      summary: sends new message
      description: |-
        creates a new message and sends it to the conversation,
        adding it to the conversation's log upon success,
        if the new message has the "response" property != 0, it means
        this new message is an answer to the message specified in the "response" property
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/Message" 
      responses:
        "201":
          description: the message was correctly sent and added to the messages of the conversation
          content:
            application/json:
              schema: 
                  $ref: "#/components/schemas/Conversation/properties/messages"
        "400":
          description: something's wromg with the message content (ex. corrupted image)
        "401":
          description: |-
            the given authorization id isn't valid.
        "500":
          description: server error occurred. Please, try again in a few minutes.
    delete:
      tags: ["message"]
      summary: deletes one or more messages
      description: |-
        deletes all messages that have their Ids in the list
        passed in the requestbody
        if the operation succeeds, the chosen message are cancelled
        and removed from the conversation messages' list.
        Afterwards the chat will be updated,
        showing only the remaining messages
      operationId: deleteMessage
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/Message/properties/id"
      responses:
        "204": 
          description: messages successfully deleted and list successfully updated
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: "#/components/schemas/Conversation/properties/messages"
        "401":
          description: the given Authentication id was wrong.
        "404":
          description: |-
            the message you are trying to delete was already deleted
            or wasn't part of this conversation at all
        "500":
          description: server error occurred. Please, try again in a few minutes.




  /session/conversations/{id}/messages/{id}: 
    parameters:
      - $ref: "#/components/parameters/Authorization"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: ["message"]
      summary: forwards a message
      description: |-
        takes one message from a conversation
        (based on their message and conversation IDs)
        and forwards them to one or more chat,
        basically creating one copy of the message for each chosen conversation
        setting their "forwarded" flag to true
      operationId: forwardMessage
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/parameters/ConversationId"        
      responses:
        "201":
          description: message succesfully forwarded to all chosen groups
          content:
            application/json:
              schema: 
                type: array
                items:
                  $ref: "#/components/schemas/Conversation/properties/preview"
        "401":
          description: the given Authentication id was wrong.
        "404":
          description: one or more conversations couldn't be found or don't exist.
        "500":
          description: server error occurred. Please, try again in a few minutes.
    put: 
      tags: ["message"]
      summary: comments a message
      description: |-
        given a message in the chat, the user can comment it
        (a.k.a react to it) by adding the desired emoji to the message's
        reactions pool.
        if an emoji associated to your Id is already present in
        the message's reaction pool, the one in the pool will be replaced with the newly chosen one.
        if everything goes well, the updated message (with the updated reaction pool) is returned.
      operationId: commentMessage
      requestBody:
        content:
          application/json:
            schema:
              type: string
              pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]{1}$"
              description: the chosen reaction given to the message
      responses:
        "200":
          description: message commented successfully.
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Message"
        "404":
          description: |-
            the chosen emoji is not valid or not supported
        "401":
          description: the given authorization id isn't valid or the message doesn't exists
        "500":
          description: server error occurred. Please, try again in a few minutes.
    delete:
      tags: ["message"]
      summary: uncomment a message
      description: |-
        deletes a comment from the message's reaction pool.
        if no emoji associated to your id is found, nothing happens
      operationId: uncommentMessage
      responses:
        "204": 
          description: message uncommented successfully.
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Message"
        "404":
          description: no reaction associated to your id was found for this message
        "401":
          description: the given authorization id isn't valid or the message doesn't exists
        "500":
          description: server error occurred. Please, try again in a few minutes.



      


