openapi: 3.0.0
info:
  title: WasaText
  version: 0.0.1
servers:
  - url: 'https://localhost:3000'
tags:
  - name: 'login'
  - name: 'user'
  - name: 'conversation'
  - name: 'group'
  - name: 'message'
  - name: 'image'


components:
  

  schemas:

    UserID:
      description: The unique id of a user, automatically generated when the account is created.
      type: integer
      format: int32
      minimum: 1
      maximum: 100000
      readOnly: true

    UserName:
      description: The username; it can be modified, but no 2 people can have the same one at the same time.
      type: string
      pattern: 'ˆ.*?$'
      minLength: 3
      maxLength: 16

    Image:
      description: The image object, made of its name and the actual image base64-encoded.
      type: string
      format: byte
      pattern: 'ˆ.*?$'
      minLength: 1
      maxLength: 10000000

    MessageID:
      description: The unique identifier of a message, automatically generated when the message is first created and sent.
      type: integer
      format: int32
      minimum: 1
      maximum: 100000
      readOnly: true

    Text:
      description: The content of a simple/plain text messsage.
      type: string
      pattern: 'ˆ.*?$'
      minLength: 1
      maxLength: 10000
          
    ConversationID:
      description: The unique identifier of a chat, automatically generated when the conversation is started.
      type: integer
      format: int32
      minimum: 1
      maximum: 100000
      readOnly: true

    ConversationName:
      description: The name of the conversation, which can be either the name of a group or of a person.
      type: string
      pattern: 'ˆ.*?$'
      minLength: 1
      maxLength: 20

    TimeStamp:
      description: The time at which the last message was sent.
      type: string
      format: date-time
      minLength: 20
      maxLength: 20
      readOnly: true
      example: "2017-07-21T17:32:28Z"

    Preview:
      description: The preview of a conversation.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ConversationName"
        image:
          $ref: "#/components/schemas/Image"
        id:
          $ref: "#/components/schemas/ConversationID"
        lastmessage:
          $ref: "#/components/schemas/Message"

    Emoji:
      description: an emoji
      type: string
      pattern: "[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]"
      minLength: 0
      maxLength: 1
      default: ""

    Reaction: 
      description: The reaction/emoji to a messsage; each person can put at most one emoji.
      type: object
      properties:
        sender:
          $ref: "#/components/schemas/UserName"
        emoji:
          $ref: "#/components/schemas/Emoji"
          

    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UserID"
        name:
          $ref: "#/components/schemas/UserName"
        image:
          $ref: "#/components/schemas/Image"

    MessageContent:
      type: object
      properties:
        text:
          $ref: "#/components/schemas/Text"
        image:
          $ref: "#/components/schemas/Image"
        
    Message:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/MessageID"
        conversation:
          $ref: "#/components/schemas/ConversationID"
        sender:
          $ref: "#/components/schemas/User"
        timestamp:
          $ref: "#/components/schemas/TimeStamp"
        checkmark:
          description: Tells you whether the message was received, read, or none of the two.
          type: string
          format: byte
          enum:
            - "sent"
            - "received"
            -  "read"
        text:
          $ref: "#/components/schemas/Text"
        image:
          $ref: "#/components/schemas/Image"
        responseTo:
          $ref: "#/components/schemas/MessageID"
        reactions:
          description: The list of all emojis (reactions) to this message.
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Reaction"

    Conversation:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ConversationID"
        name:
          $ref: "#/components/schemas/ConversationName"
        image:
          $ref: "#/components/schemas/Image"
        group:
          description: flag indicating whether the conversation is a group (true) or (false)
          type: boolean
          default: true
          readOnly: true
        participants:
          description: List of all members of a group chat. 
          type: array
          minItems: 3
          maxItems: 50
          items:
            $ref: "#/components/schemas/User"
          nullable: true
        messages:
          description: The list of all messages sent of the chat.
          type: array
          minItems: 0
          maxItems: 100000
          items:
            $ref: "#/components/schemas/Message"


  parameters:

    SearchName:
      description: The name string used to search for users or conversations
      name: srcName
      in: query
      required: false
      schema:
        type: string
        format: byte
        pattern: 'ˆ.*?$'
        minLength: 0
        maxLength: 20
        default: ""
    
    UserId:
      description: The user identifier, which must be passed for any possible operation.
      name: usrId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UserID"

    ConversationId:
      description: The identifer of a conversation, used for any kind of acess to that conversation.
      name: convId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConversationID"

    MessageId:
      description: The identifer of a message, used whenever you want to comment, respond, share, or modify that message.
      name: msgId
      in: path
      required: true
      schema: 
        $ref: "#/components/schemas/MessageID"



  securitySchemes:

    AuthenticationId:
      type: http
      scheme: bearer
      bearerFormat: JWT

  
  responses:

    UnauthorizedError:
      description: Access token is missing or invalid.

    ServerError: 
      description: Server error occurred. Please, try again in a few minutes.

    NotFoundError:
      description: The given id(s) doesn't correspond witha any user/session/message. Please try again.

    BadRequestError:
      description: You either aren't an admin to do this operation or the given input(s) are invalid.

    ItemDeleted:
      description: Item(s) succesfully deleted.

    ConversationUpdated:
      description: Conversation successfully updated.
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Conversation"

    UserInfoUpdated:
      description: Info of User successfully updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"



security:
  - AuthenticationId: []



paths:


  /session:
    post:
      tags: [login]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/UserID"
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    
  /users/{usrId}/others:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [user]
      summary: let you search all users
      description: |-
        allows you to search other users via the username. 
        if more than one match is found, only the first 50 are shown.
      operationId: getUsers
      parameters:
        - $ref: "#/components/parameters/SearchName"
      responses:
        "200": 
          description: The following users have been found.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    
  /users/{usrId}/image:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [user]
      summary: modifies the profile picture
      description: |-
        modifies the profile picture, with the one specified in the request body.
        then, it returns the updated profile of the user
      operationId: setMyPhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  $ref: "#/components/schemas/Image"
      responses:
        "200":
          description: User image modified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/name:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [user]
      summary: modifies the username, if possible
      description: |-
        if the chosen username isn't taken, modifies it, with the one specified.
        Then, it returns the updated profile of the user.
      operationId: setMyUserName
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: User name modified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversations:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [conversation]
      summary: get list of conversations
      description: |-
        returns the list of previews of the first 50 conversations in which the user is a participant.
        the list is given in reverse chronological order.
      operationId: getMyConversations
      parameters:
        - $ref: "#/components/parameters/SearchName"
      responses:
        "200":
          description: The following conversations have been found.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  $ref: "#/components/schemas/Preview"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    
  /users/{usrId}/conversations/private:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post: 
      tags: [conversation]
      summary: starts a new private conversation
      description: |-
        if the operation is successful, creates a new group and add it to the list of the user's conversations.
        when creating a group, the user must specify the group's name, and at least one other member.
        if None is given, the image will be absent.
      operationId: startConversation
      parameters:
        - name: rcvId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UserID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageContent"
      responses:
        "201":
          description: New conversation succesfully started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /users/{usrId}/conversations/group:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post: 
      tags: [group]
      summary: creates a new group
      description: |-
        if the operation is successful, creates a new group and add it to the list of the user's conversations.
        when creating a group, the user must specify the group's name, and at least one other member.
        if None is given, the image will be absent.
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/ConversationName"
                participants:
                  type: array
                  minItems: 3
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/UserName"
      responses:
        "201":
          description: New group succesfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"
  


  /users/{usrId}/conversation/{convId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversation]
      summary: opens the chosen conversation
      description: |-
        based on the given id, taken from the conversation's preview,
        it returns the corresponding conversation
      operationId: getConversation
      responses:
        "200":
          description: conversation successfully loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    post: 
      tags: [group]
      summary: add new members to group
      description: |-
        adds the chosen participant to the group chat, then returns the conversation,
        with the newly updated list of participants.
      operationId: addToGroup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                participants:
                  type: array
                  minItems: 3
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/UserName"
      responses:
        "201":
          description: New members succesfully added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    minItems: 3
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [group]
      summary: leaves the group
      description: |-
        makes you leave a conversation, completely removing you from the group participants' list.
        the group will also be removed from your list of conversation and its messages deleted.
      operationId: leaveGroup
      responses:
        "204":
          $ref: "#/components/responses/ItemDeleted"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversation/{convId}/name:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    put:
      tags: [group]
      summary: changes the group's name
      description: |-
        if the conversation is a group chat, modifies its name with the one given in the request body,
        then returns the modified status of the conversation;
        otherwise, the name remains unchanged
      operationId: setGroupName
      requestBody:
        content:
          text/plain:
            schema: 
              $ref: "#/components/schemas/ConversationName"
      responses:
        "200":
          description: Group name modified successfully
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConversationName"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversation/{convId}/image:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    put:
      tags: [group]
      summary: changes the group's image
      description: |-
        modifies the chat's name with the one given in the request body,
        then returns the modified status of the conversation;
        otherwise, the picture remains unchanged
      operationId: setGroupPhoto
      requestBody:
        content:
          application/json:
              schema:
                type: object
                properties:
                  image:
                    $ref: "#/components/schemas/Image"
      responses:
        "200":
          description: User image modified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  image:
                    $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"


  /users/{usrId}/conversation/{convId}/messages:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post: 
      tags: [message]
      summary: sends new message
      description: |-
        creates a new message and sends it to the conversation, adding it to the conversation's log upon success,
        if the new message has the "responseTo" property != "", it means
        this new message is an answer to the message specified in the "response" property
      operationId: sendMessage
      parameters:
      - name: responseTo
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/MessageID"
      requestBody:
        content:
          multipart/form-data:
            schema: 
              $ref: "#/components/schemas/MessageContent"
      responses:
        "201":
          description: New message sent succesfully.
          content:
            application/json:
              schema: 
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"


  /users/{usrId}/conversation/{convId}/messages/{msgId}: 
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [message]
      summary: forwards a message
      description: |-
        forwards the message to the conversation specified in the request.
        basically creating a copy of the message in the chosen conversation.
      operationId: forwardMessage
      parameters:
        - name: destId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ConversationID"
      responses:
        "201":
          description: Message forwarded succesfully.
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [message]
      summary: deletes the message.
      description: |-
        deletes all messages that have their Ids in the list
        passed in the requestbody (up to 10 messages at once)
        if the operation succeeds, the chosen messages are cancelled
        and removed from the conversation messages' list.
        Afterwards the chat will be updated,
        showing only the remaining messages
      operationId: deleteMessage
      responses:
        "204": 
          $ref: "#/components/responses/ItemDeleted"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversation/{convId}/messages/{msgId}/reactions:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post: 
      tags: [message]
      summary: comments a message
      description: |-
        given a message in the chat, the user can comment it
        (a.k.a react to it) by adding the desired emoji to the message's
        reactions pool.
        If an emoji associated to your Id is already present in
        the message's reaction pool, the one in the pool will be replaced with the newly chosen one.
        If everything goes well, the updated message (with the updated reaction pool) is returned.
      operationId: commentMessage
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/Emoji"
      responses:
        "201":
          description: Reaction sent or changed succesfully. 
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 100
                items:
                  $ref: "#/components/schemas/Reaction"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [message]
      summary: removes a reaction.
      description: |-
        checks for a reaction having the same sender id as the user,
        in which case, the reaction sent by the user for that specific message will be removed.
      operationId: uncommentMessage
      responses:
        "204": 
          $ref: "#/components/responses/ItemDeleted"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/ServerError"