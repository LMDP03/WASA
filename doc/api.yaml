openapi: 3.0.0
info:
  title: Fantastic Coffee (decaffeinated)
  version: 1.0.0
servers:
  - url: 'https://localhost:3000'
tags:
  - name: 'login'
  - name: 'user'
  - name: 'conversation'
  - name: 'group'
  - name: 'message'
  - name: 'image'


components:
  

  schemas:
    UserID:
      description: The unique authorization id of a user, automatically generated when the account is created.
      type: integer
      format: int32
      minLength: 1
      maxLength: 100000
      readOnly: true

    UserName:
      description: Tthe username; it can be modified, but no 2 people can have the same one at the same time.
      type: string
      format: byte
      pattern: 'ˆ.*?$'
      minLength: 3
      maxLength: 16

    Image:
      description: The user's or a conversation's profile picture, used for requests.
      type: string
      format: binary
      minLength: 0
      maxLength: 10000000
      nullable: true

    ImageID:
      type: string
      format: uuid
      minLength: 32
      maxLength: 32
      readOnly: true

    MessageID:
      description: The unique identifier of a message, automatically generated when the message is first created and sent.
      type: integer
      format: int32
      minimum: 1
      maximum: 1000000
      readOnly: true

    Text:
      description: The content of a text messsage; can be either a simple text message, emoji, or a file/img/gif;
        there must be at least a character/file/emoji and no more than 1000 chracters.
      type: string
      format: byte
      anyOf:
        - description: simple text
          pattern: 'ˆ.*?$'
        - description: emoji
          pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]$"
      minLength: 1
      maxLength: 10000
          
    ConversationID:
      description: The unique identifier of a chat, automatically generated when the conversation is started.
      type: integer
      format: int32
      minimum: 1
      maximum: 1000000
      readOnly: true

    ConversationName:
      description: The name of the conversation, which can be either the name of a group or of a person.
      type: string
      format: byte
      pattern: 'ˆ.*?$'
      minLength: 1
      maxLength: 20

    TimeStamp:
      description: The time at which the last message was sent.
      type: string
      format: date-time
      minLength: 20
      maxLength: 20
      readOnly: true
      example: "2017-07-21T17:32:28Z"

    Snippet:
      description: The preview of a message in a specific conversation;
        if there is no message in the conversation, when used for a conversation's preview it will be blank (null) instead.
      type: object
      properties:
        sender:
          $ref: "#/components/schemas/UserID"
        timestamp:
          $ref: "#/components/schemas/TimeStamp"
        content:
          description: the preview of the actual Message (in case of an image/file, it will be simply an icon)
          oneOf:
            - description: text preview
              type: string
              format: byte
              anyOf:
                - description: simple text
                  pattern: 'ˆ.*?$'
                - description: emoji
                  pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]$"
              minLength: 1
              maxLength: 30
            - $ref: "#/components/schemas/ImageID"
        link:
          $ref: "#/components/schemas/MessageID"
      nullable: true
      readOnly: true

    Preview:
      description: The preview of a conversation.
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ConversationName"
        image:
          $ref: "#/components/schemas/ImageID"
        id:
          $ref: "#/components/schemas/ConversationID"
        snippet:
          $ref: "#/components/schemas/Snippet"

    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UserID"
        name:
          $ref: "#/components/schemas/UserName"
        image:
          $ref: "#/components/schemas/ImageID"
        conversations:
          type: array
          minItems: 0
          maxItems: 1000000
          items:
            $ref: "#/components/schemas/ConversationID"

    Message:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/MessageID"
        sender:
          $ref: "#/components/schemas/UserID"
        timestamp:
          $ref: "#/components/schemas/TimeStamp"
        checkmark:
          description: Tells you whether the message was received, read, or none of the two.
          type: string
          format: byte
          enum:
            - "unreceived"
            - "received"
            -  "read"
        content:
          oneOf:
            - $ref: "#/components/schemas/Text"
            - $ref: "#/components/parameters/ImageId"
        responseTo:
          $ref: "#/components/schemas/MessageID"
        reactions:
          description: The list of all emojis (reactions) to this message; each person can put at most one emoji;
            the list is in the form of a hashmap with (UserID - emoji) pairs.
          type: object
          additionalProperties:
            type: string
            format: byte
            pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]$"
            minLength: 0
            maxLength: 1
            default: ""

    Conversation:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ConversationID"
        name:
          $ref: "#/components/schemas/ConversationName"
        image:
          $ref: "#/components/schemas/ImageID"
        participants:
          description: List of all members of a group chat. 
          type: array
          minItems: 1
          maxItems: 1000000
          items:
            $ref: "#/components/schemas/UserID"
          nullable: true
        messages:
          description: The list of all messages sent of the chat.
          type: array
          minItems: 0
          maxItems: 1000000
          items:
            $ref: "#/components/schemas/Message"


  parameters:

    SearchName:
      description: The name string used to search for users or conversations
      name: srcName
      in: query
      required: false
      schema:
        type: string
        format: byte
        pattern: 'ˆ.*?$'
        minLength: 0
        maxLength: 20
        default: ""
    
    UserId:
      description: The user identifier, which must be passed for any possible operation.
      name: usrId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UserID"

    ConversationId:
      description: The identifer of a conversation, used for any kind of acess to that conversation.
      name: cnvId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConversationID"

    MessageId:
      description: The identifer of a message, used whenever you want to comment, respond, share, or modify that message.
      name: msgId
      in: path
      required: true
      schema: 
        $ref: "#/components/schemas/MessageID"

    ImageId:
      description: The unique identifier used to retrieve an image.
      name: imgId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ImageID"



  securitySchemes:

    AuthenticationId:
      type: http
      scheme: bearer
      bearerFormat: JWT

  
  responses:

    UnauthorizedError:
      description: Access token is missing or invalid.

    ServerError: 
      description: Server error occurred. Please, try again in a few minutes.

    NotFoundError:
      description: The given id(s) doesn't correspond witha any user/session/message. Please try again.

    BadRequestError:
      description: You either aren't an admin to do this operation or the given input(s) are invalid.

    ItemDeleted:
      description: Item(s) succesfully deleted.

    ConversationUpdated:
      description: Conversation successfully updated.
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Conversation"

    UserInfoUpdated:
      description: Info of User successfully updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"



security:
  - AuthenticationId: []



paths:


  /session:
    post:
      tags: [login]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created, and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserName"
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    $ref: "#/components/schemas/UserID"

    
  /images/{imgId}:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    get:
      tags: [image]
      summary: let you retrieve an image
      description: uses the id of the image, to0 acess a local database and retrieve the associated picture.
      operationId: getImage
      responses:
        "200":
          description: Image found and returned.
          content:
            image/*:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
        

  /users/{usrId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [user]
      summary: let you search all users
      description: |-
        allows you to search other users via the username. 
        if more than one match is found, only the first 50 are shown.
      operationId: getUsers
      parameters:
        - $ref: "#/components/parameters/SearchName"
      responses:
        "200": 
          description: The following users have been found.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: object
                  properties:
                    username:
                      $ref: "#/components/schemas/UserName"
                    image:
                      $ref: "#/components/schemas/ImageID"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [user]
      summary: modifies the username, if possible
      description: |-
        if the chosen username isn't taken, modifies it, with the one specified.
        Then, it returns the updated profile of the user.
      operationId: setMyUserName
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/UserName"
      responses:
        "201":
          $ref: "#/components/responses/UserInfoUpdated"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [user]
      summary: modifies the profile picture
      description: |-
        modifies the profile picture, with the one specified in the request body.
        then, it returns the updated profile of the user
      operationId: setMyPhoto
      requestBody:
        content:
          image/*:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        "200":
          $ref: "#/components/responses/UserInfoUpdated"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"


  /users/{usrId}/conversations:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [conversation]
      summary: get list of conversations
      description: |-
        returns the list of previews of the first 50 conversations in which the user is a participant.
        the list is given in reverse chronological order.
      operationId: getMyConversations
      parameters:
        - $ref: "#/components/parameters/SearchName"
      responses:
        "200":
          description: The following conversations have been found.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  $ref: "#/components/schemas/Preview"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    post: 
      tags: [group]
      summary: creates a new group
      description: |-
        if the operation is successful, creates a new group and add it to the list of the user's conversations.
        when creating a group, the user must specify the group's name, and at least one other member.
        if None is given, the image will be absent.
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Conversation"
          image/*:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        "201":
          description: New group succesfully created.
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  $ref: "#/components/schemas/Preview"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"
  

  /users/{usrId}/conversations/{convId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversation]
      summary: opens the chosen conversation
      description: |-
        based on the given id, taken from the conversation's preview,
        it returns the corresponding conversation
      operationId: getConversation
      responses:
        "200":
          description: conversation successfully loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    put: 
      tags: [group]
      summary: add new members to group
      description: |-
        adds the chosen participant to the group chat, then returns the conversation,
        with the newly updated list of participants.
      operationId: addToGroup
      requestBody:
        content:
          text/plain:
            schema: 
              $ref: "#/components/schemas/UserName"
      responses:
        "200":
          $ref: "#/components/responses/ConversationUpdated"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [group]
      summary: leaves the group
      description: |-
        makes you leave a conversation, completely removing you from the group participants' list.
        the group will also be removed from your list of conversations and its messages deleted.
      operationId: leaveGroup
      responses:
        "204":
          $ref: "#/components/responses/ItemDeleted"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversations/{convId}/name:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    put:
      tags: [group]
      summary: changes the group's name
      description: |-
        if the conversation is a group chat, modifies its name with the one given in the request body,
        then returns the modified status of the conversation;
        otherwise, the name remains unchanged
      operationId: setGroupName
      requestBody:
        content:
          text/plain:
            schema: 
              $ref: "#/components/schemas/ConversationName"
      responses:
        "200":
          $ref: "#/components/responses/ConversationUpdated"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversations/{convId}/image:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    put:
      tags: [group]
      summary: changes the group's image
      description: |-
        modifies the chat's name with the one given in the request body,
        then returns the modified status of the conversation;
        otherwise, the picture remains unchanged
      operationId: setGroupPhoto
      requestBody:
        content:
          image/*:
            schema: 
              $ref: "#/components/schemas/Image"
      responses:
        "200":
          $ref: "#/components/responses/ConversationUpdated"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"


  /users/{usrId}/conversations/{convId}/messages:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post: 
      tags: [message]
      summary: sends new message
      description: |-
        creates a new message and sends it to the conversation, adding it to the conversation's log upon success,
        if the new message has the "responseTo" property != 0, it means
        this new message is an answer to the message specified in the "response" property
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/Message"
          image/*:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        "201":
          description: New message sent succesfully.
          content:
            application/json:
              schema: 
                  $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"


  /users/{usrId}/conversations/{convId}/messages/{msgId}: 
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [message]
      summary: forwards a message
      description: |-
        forwards the message to the conversation specified in the request.
        basically creating a copy of the message in the chosen conversation.
      operationId: forwardMessage
      requestBody:
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/ConversationID"
      responses:
        "201":
          description: Message forwarded succesfully.
          content:
            application/json:
              schema: 
                type: array
                minItems: 1
                maxItems: 50
                items:
                  $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [message]
      summary: deletes the message.
      description: |-
        deletes all messages that have their Ids in the list
        passed in the requestbody (up to 10 messages at once)
        if the operation succeeds, the chosen messages are cancelled
        and removed from the conversation messages' list.
        Afterwards the chat will be updated,
        showing only the remaining messages
      operationId: deleteMessage
      responses:
        "204": 
          $ref: "#/components/responses/ItemDeleted"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{usrId}/conversations/{convId}/messages/{msgId}/reactions:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [message]
      summary: show the reactions
      description: show all the present reactions of the message
      operationId: getReactions
      responses:
        "200":
          description: reactions succesfully loaded.
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 1000000
                items:
                  type: string
                  format: byte
                  pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]$"
                  maxLength: 0
                  minLength: 1
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/ServerError"
    post: 
      tags: [message]
      summary: comments a message
      description: |-
        given a message in the chat, the user can comment it
        (a.k.a react to it) by adding the desired emoji to the message's
        reactions pool.
        If an emoji associated to your Id is already present in
        the message's reaction pool, the one in the pool will be replaced with the newly chosen one.
        If everything goes well, the updated message (with the updated reaction pool) is returned.
      operationId: commentMessage
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              format: byte
              minLength: 0
              maxLength: 1
              pattern: "^[\u203C-\u3299\u1F004\u1F0CF\u1F9FF]{1}$"
              description: the chosen reaction given to the message
      responses:
        "201":
          description: Reaction sent or changed succesfully. 
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [message]
      summary: removes a reaction.
      description: |-
        checks for a reaction having the same sender id as the user,
        in which case, the reaction sent by the user for that specific message will be removed.
      operationId: uncommentMessage
      responses:
        "204": 
          $ref: "#/components/responses/ItemDeleted"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/ServerError"